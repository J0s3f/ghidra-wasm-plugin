name: Probes

# Enforces "every feature has a wasm binary and is tested": the synthetic probe suite in
# test-scripts/ plus the small committed fixture must reproduce the metrics recorded in
# test-scripts/expected-results.json (the baseline documented in MODERN_WASM_GAPS.md 2.4/2.5).
# Any drift in funcs/instrs/undefined_bytes/decompiled/decompile_failed, a probe that silently
# disappears, an expected import failure that starts importing, or a decompiler regression on the
# fixture fails the job.

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  probes:
    runs-on: ubuntu-latest

    steps:
    - name: Clone Repository
      uses: actions/checkout@v7

    - name: Install Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: '9.2.1'

    - name: Install Ghidra 12.1.4
      uses: antoniovazquezblanco/setup-ghidra@v2
      with:
        auth_token: ${{ secrets.GITHUB_TOKEN }}
        version: '12.1.4'

    - name: Build
      run: gradle buildExtension

    - name: Install the built extension into Ghidra
      run: |
        set -euxo pipefail
        export GHIDRA_INSTALL_DIR="${GHIDRA_INSTALL_DIR:?setup-ghidra did not export GHIDRA_INSTALL_DIR}"
        EXT_DIR="$GHIDRA_INSTALL_DIR/Ghidra/Extensions"
        mkdir -p "$EXT_DIR"
        find "$EXT_DIR" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        # dist/ holds exactly one extension zip; install it exactly like Ghidra's extension dialog.
        unzip -q -o "$(ls -1 dist/*.zip | head -n 1)" -d "$EXT_DIR"
        find "$EXT_DIR" -maxdepth 3 -name '*.jar' -print

    - name: Prepare Linux shims for run_probes.ps1
      run: |
        set -euxo pipefail
        export GHIDRA_INSTALL_DIR="${GHIDRA_INSTALL_DIR:?setup-ghidra did not export GHIDRA_INSTALL_DIR}"
        export GHIDRA_HEADLESS_MAXMEM=1500M
        # run_probes.ps1 shells out to `python` (the runner image only guarantees python3).
        command -v python || sudo ln -sf "$(command -v python3)" /usr/local/bin/python
        python --version
        # run_probes.ps1 locates the launcher with `Join-Path $GhidraDir "support\analyzeHeadless.bat"`.
        # A backslash is not a path separator on Linux, so that lookup would fail and the script
        # would throw before importing anything. Symlinking the real launcher under the literal name
        # keeps run_probes.ps1 unmodified. (A one-character `support/` fix in run_probes.ps1 would
        # make this shim unnecessary.)
        ln -sf "$GHIDRA_INSTALL_DIR/support/analyzeHeadless" "$GHIDRA_INSTALL_DIR/support\\analyzeHeadless.bat"
        ls -l "$GHIDRA_INSTALL_DIR/support" | grep -i analyzeheadless

    - name: Run probe suite
      run: |
        set -euxo pipefail
        pwsh -NoProfile -Command '& ./test-scripts/run_probes.ps1 -OutDir "$env:RUNNER_TEMP/probes" -GhidraDir "$env:GHIDRA_INSTALL_DIR"'

    - name: Semantic regression checks (call-store, br-table, padded memargs, hybrid)
      run: |
        set -euxo pipefail
        # The pre-release-review fixes are pinned by semantic checks that execute the emulator:
        # a valid store after a call (R1), the br_table DEFAULT target under the expansion bound
        # (R5), padded-LEB memargs incl. the 26-byte emulator re-parse (R6), and the memory64
        # hybrid constructor/emulation matrix. GHIDRA_INSTALL_DIR and the Linux shims come from
        # the steps above; every script exits non-zero on any failure.
        export GHIDRA_INSTALL_DIR="${GHIDRA_INSTALL_DIR:?setup-ghidra did not export GHIDRA_INSTALL_DIR}"
        export GHIDRA_HEADLESS_MAXMEM=1500M
        pwsh -NoProfile -File test-scripts/check-call-store-semantics.ps1 -OutDir "$RUNNER_TEMP/semantics-call-store"
        pwsh -NoProfile -File test-scripts/check-brtable-default.ps1 -SkipBuild -OutDir "$RUNNER_TEMP/semantics-brtable"
        pwsh -NoProfile -File test-scripts/check-memarg-padding.ps1 -OutDir "$RUNNER_TEMP/semantics-memarg"
        pwsh -NoProfile -File test-scripts/check-memory64-hybrid.ps1 -OutDir "$RUNNER_TEMP/semantics-hybrid"

    - name: Fixture decompile baseline
      run: |
        set -euxo pipefail
        export GHIDRA_INSTALL_DIR="${GHIDRA_INSTALL_DIR:?setup-ghidra did not export GHIDRA_INSTALL_DIR}"
        export GHIDRA_HEADLESS_MAXMEM=1500M
        mkdir -p "$RUNNER_TEMP/probes/fixture-project"
        "$GHIDRA_INSTALL_DIR/support/analyzeHeadless" "$RUNNER_TEMP/probes/fixture-project" WasmFixtureCI \
          -import "$GITHUB_WORKSPACE/test-scripts/fixtures/wasm_fixture.wasm" \
          -scriptPath "$GITHUB_WORKSPACE/test-scripts" \
          -postScript DumpDecomp.java -max-cpu 2 -deleteProject \
          2>&1 | tee "$RUNNER_TEMP/probes/fixture-run.log"
        # Prove DumpDecomp.java actually ran; the exact numbers are enforced by check-results.py
        # against test-scripts/expected-results.json.
        grep -E 'SUMMARY functions=[0-9]+ decompiled=[0-9]+ failed=[0-9]+ instructions=[0-9]+' \
          "$RUNNER_TEMP/probes/fixture-run.log"

    - name: Check metrics against the recorded baseline
      run: |
        set -euxo pipefail
        python3 test-scripts/check-results.py \
          --log "$RUNNER_TEMP/probes/probe-run.log" \
          --fixture-log "$RUNNER_TEMP/probes/fixture-run.log" \
          --require-fixture

    - name: Fetch wabt (fixture-validity oracle)
      run: |
        set -euxo pipefail
        pwsh -NoProfile -File test-scripts/spectest/fetch_spectest_tools.ps1 \
          -ToolsDir "$RUNNER_TEMP/spectest-tools" -WabtOnly

    - name: Fixture validity gate
      run: |
        set -euxo pipefail
        # Every probe that claims to exercise a feature must be a valid module. The recorded
        # classification (test-scripts/fixture-validity.json) was produced by wabt + binaryen;
        # wabt alone enforces it here (binaryen is a 111 MB download, run it locally with
        # --binaryen for the full two-oracle check).
        python3 test-scripts/check-fixture-validity.py \
          --generate \
          --probes "$RUNNER_TEMP/fixture-probes" \
          --wabt "$RUNNER_TEMP/spectest-tools/wabt-1.0.42/bin"

    - name: Fetch binaryen (decode-oracle second engine)
      run: |
        set -euxo pipefail
        # The decode oracle cross-checks our plugin against TWO reference decoders: wabt
        # (wasm-objdump) and binaryen (wasm-dis). The fixture-validity gate above fetches wabt
        # only; this adds the pinned, checksum-verified binaryen release version_133 to the
        # same tools dir (wabt is already present and is skipped). Per-OS x86_64 tarball
        # (Windows + Linux); the sha256 is hard-coded in fetch_spectest_tools.ps1.
        pwsh -NoProfile -File test-scripts/spectest/fetch_spectest_tools.ps1 \
          -ToolsDir "$RUNNER_TEMP/spectest-tools" -WabtOnly -Binaryen

    - name: Decode oracle (plugin == wabt == binaryen)
      run: |
        set -euxo pipefail
        # "Our decode matches a second engine on real modules" as a checked property
        # (REUSE_OPPORTUNITIES.md section 1 / work order step 4). Imports the pinned, committed,
        # valid corpus modules (rust_plain + rust_simd128) through the plugin headlessly, then
        # runs WABT wasm-objdump -d/-x AND binaryen wasm-dis (timeout-guarded) and compares
        # function counts, per-function instruction counts and normalized opcode histograms
        # against the recorded baseline (test-scripts/decode-oracle-baseline.json). Exits
        # non-zero on any divergence. Fully offline apart from the oracles fetched above.
        export GHIDRA_INSTALL_DIR="${GHIDRA_INSTALL_DIR:?setup-ghidra did not export GHIDRA_INSTALL_DIR}"
        export GHIDRA_HEADLESS_MAXMEM=1500M
        pwsh -NoProfile -File test-scripts/decode-oracle.ps1 \
          -WabtDir "$RUNNER_TEMP/spectest-tools/wabt-1.0.42/bin" \
          -BinaryenDir "$RUNNER_TEMP/spectest-tools/binaryen-version_133/bin" \
          -CorpusDir "$RUNNER_TEMP/decode-corpus" \
          -WorkDir "$RUNNER_TEMP/decode-oracle"

    - name: Harness capture regression test
      run: |
        set -euxo pipefail
        # The probe/spec runners capture analyzeHeadless output; a native command's stderr must not
        # abort them, and the log must be UTF-8 for check-results.py (5.1's Tee-Object wrote UTF-16).
        pwsh -NoProfile -File test-scripts/test-stderr-capture.ps1 -OutDir "$RUNNER_TEMP/stderr-capture"

    - name: Upload probe logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: probe-run-log
        path: |
          ${{ runner.temp }}/probes/probe-run.log
          ${{ runner.temp }}/probes/fixture-run.log
        if-no-files-found: warn
