name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish to. No default: it has to be typed deliberately, it must already exist, and it must resolve to the same commit as this run."
        required: true
      ghidra_versions:
        description: "JSON array of Ghidra versions to build against"
        required: true
        default: '["12.1.4","12.1.3"]'
      allow_overwrite:
        description: "Allow replacing the assets of a release that already exists (default: false)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build (Ghidra ${{ matrix.ghidra }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ghidra: ${{ fromJSON(github.event.inputs.ghidra_versions || '["12.1.4","12.1.3"]') }}

    steps:
    - name: Clone Repository
      uses: actions/checkout@v7
      with:
        # Always build exactly the commit that triggered this run. The tag input of a manual
        # dispatch must never decide what gets built - only where the build is published.
        ref: ${{ github.sha }}

    - name: Install Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: '9.2.1'

    - name: Install Ghidra ${{ matrix.ghidra }}
      uses: antoniovazquezblanco/setup-ghidra@v2
      with:
        auth_token: ${{ secrets.GITHUB_TOKEN }}
        version: ${{ matrix.ghidra }}

    - name: Build extension
      run: gradle buildExtension

    - name: Upload extension
      uses: actions/upload-artifact@v7
      with:
        name: wasm-ghidra-${{ matrix.ghidra }}
        path: dist/*.zip
        if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Clone Repository
      uses: actions/checkout@v7
      with:
        # The commit being published is the one that triggered the run - not the tag input, and
        # not the tip of whatever branch a dispatch was started from.
        ref: ${{ github.sha }}

    - name: Download built extensions
      uses: actions/download-artifact@v8
      with:
        path: dist
        merge-multiple: true

    - name: Verify the tag, then create or update the release
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT_NAME: ${{ github.event_name }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_ALLOW_OVERWRITE: ${{ inputs.allow_overwrite }}
        REF_NAME: ${{ github.ref_name }}
        TARGET_SHA: ${{ github.sha }}
        REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail

        # ------------------------------------------------------------- target tag
        #   push/tag  : the tag itself triggered this run.
        #   dispatch  : the tag is operator input. It has NO default, so an accidental dispatch
        #               cannot fall back to some stale tag (this workflow used to default it to
        #               v2.5.0, which let any branch publish over the 2.5.0 assets).
        if [ "${EVENT_NAME:-}" = "push" ]; then
          TAG="$REF_NAME"
        else
          TAG="$(printf '%s' "${INPUT_TAG:-}" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          if [ -z "$TAG" ]; then
            echo "::error::no release tag given (event=$EVENT_NAME, inputs.tag='${INPUT_TAG:-}'). The tag input is required and has no default - pass an existing tag."
            exit 1
          fi
        fi
        echo "target tag   : $TAG"
        echo "built commit : $TARGET_SHA"
        echo "event        : $EVENT_NAME"

        # ------------------------------- the tag must exist and must be the commit we built
        # A dispatch checks out the dispatched ref - usually a branch - while the tag input only
        # selects the destination. So the tag is resolved through the API and compared with the
        # commit that was actually built. Without this, a dispatch from any branch could replace
        # the assets of an older release.
        if ! TAG_SHA="$(gh api "repos/$REPOSITORY/commits/$TAG" --jq '.sha' 2>/dev/null)"; then
          echo "::error::cannot read tag '$TAG' in $REPOSITORY (does it exist?). This workflow never creates a tag - refusing to publish."
          exit 1
        fi
        if [ -z "$TAG_SHA" ] || [ "$TAG_SHA" = "null" ]; then
          echo "::error::tag '$TAG' does not resolve to a commit in $REPOSITORY. Create and push the tag first."
          exit 1
        fi
        if [ "$TAG_SHA" != "$TARGET_SHA" ]; then
          echo "::error::tag '$TAG' resolves to $TAG_SHA but this run built $TARGET_SHA - refusing to publish artifacts of a different revision to '$TAG'."
          exit 1
        fi
        HEAD_SHA="$(git rev-parse HEAD)"
        if [ "$HEAD_SHA" != "$TARGET_SHA" ]; then
          echo "::error::the checkout is $HEAD_SHA, expected $TARGET_SHA - refusing to publish a build that is not the tag's commit."
          exit 1
        fi
        echo "verified      : tag '$TAG' -> $TAG_SHA == the built commit"

        # ------------------------------------------------------ overwrite permission
        # Uploading over an existing release replaces its assets, so it has to be asked for.
        # Push runs are idempotent only when their tag has NOT moved: if the release already
        # exists, its recorded target commit (release.targetCommitish, resolved to a commit)
        # must still be the commit this push verified above; otherwise the maintainer must
        # re-dispatch manually with allow_overwrite=true. Truth table:
        #   event   release exists?   existing target == built commit?   allow_overwrite?  result
        #   push    no               n/a                              n/a               create
        #   push    yes              yes                              n/a               replace (clobber)
        #   push    yes              no                               n/a               refuse, ask to re-dispatch
        #   dispatch n/a (handled)   n/a                              true              replace (clobber)
        #   dispatch n/a (handled)   n/a                              false             refuse if release exists
        OVERWRITE=0
        if [ "${INPUT_ALLOW_OVERWRITE:-false}" = "true" ]; then
          echo "allow_overwrite=true : replacing the assets of an existing release is permitted"
          OVERWRITE=1
        fi
        if [ "$EVENT_NAME" = "push" ]; then
          if gh release view "$TAG" --repo "$REPOSITORY" --json tagName >/dev/null 2>&1; then
            EXISTING_TARGET="$(gh release view "$TAG" --repo "$REPOSITORY" \
              --json targetCommitish --jq '.targetCommitish // empty' 2>/dev/null || true)"
            EXISTING_SHA="$EXISTING_TARGET"
            case "$EXISTING_TARGET" in
              ''|null) EXISTING_SHA="" ;;
              *[!0-9a-fA-F]*) \
                EXISTING_SHA="$(gh api "repos/$REPOSITORY/commits/${EXISTING_TARGET}" \
                  --jq '.sha' 2>/dev/null || true)" ;;
            esac
            if [ -z "$EXISTING_SHA" ] || [ "$EXISTING_SHA" != "$TAG_SHA" ]; then
              echo "::error::release '$TAG' already exists and its recorded target commit " \
                "(${EXISTING_TARGET:-<empty>}, resolved to ${EXISTING_SHA:-<unresolved>}) differs " \
                "from this push's verified tag commit $TAG_SHA (the tag appears to have moved). " \
                "Refusing to overwrite without an explicit decision - re-dispatch this workflow " \
                "manually with allow_overwrite=true to replace the existing release's assets."
              exit 1
            fi
            echo "push: existing release '$TAG' targets the same commit $TAG_SHA - idempotent replace permitted"
            OVERWRITE=1
          else
            echo "push: release '$TAG' does not yet exist - will create it"
          fi
        fi

        # -------------------------------------------------------------------- publish
        ls -l dist
        if gh release view "$TAG" --repo "$REPOSITORY" --json tagName >/dev/null 2>&1; then
          if [ "$OVERWRITE" -ne 1 ]; then
            echo "::error::release '$TAG' already exists. Re-publishing would replace its assets - re-dispatch with allow_overwrite=true to confirm, or delete the release '$TAG' first."
            exit 1
          fi
          echo "Release $TAG already exists - uploading assets (overwrite permitted)"
          gh release upload "$TAG" --repo "$REPOSITORY" dist/*.zip --clobber
        else
          echo "Creating release $TAG"
          gh release create "$TAG" --repo "$REPOSITORY" \
            --title "Version ${TAG#v}" \
            --notes-file RELEASE_NOTES.md \
            --target "$TARGET_SHA" \
            dist/*.zip
        fi
        gh release view "$TAG" --repo "$REPOSITORY" --json tagName,assets \
          --template '{{.tagName}}{{range .assets}} -> {{.name}}{{end}}{{"\n"}}'
