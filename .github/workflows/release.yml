name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (created at this commit if it does not exist)"
        required: true
        default: "v2.5.0"
      ghidra_versions:
        description: "JSON array of Ghidra versions to build against"
        required: true
        default: '["12.1.4","12.1.3"]'

permissions:
  contents: write

jobs:
  build:
    name: Build (Ghidra ${{ matrix.ghidra }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ghidra: ${{ fromJSON(github.event.inputs.ghidra_versions || '["12.1.4","12.1.3"]') }}

    steps:
    - name: Clone Repository
      uses: actions/checkout@v7

    - name: Install Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: '9.2.1'

    - name: Install Ghidra ${{ matrix.ghidra }}
      uses: antoniovazquezblanco/setup-ghidra@v2
      with:
        auth_token: ${{ secrets.GITHUB_TOKEN }}
        version: ${{ matrix.ghidra }}

    - name: Build extension
      run: gradle buildExtension

    - name: Upload extension
      uses: actions/upload-artifact@v7
      with:
        name: wasm-ghidra-${{ matrix.ghidra }}
        path: dist/*.zip
        if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Clone Repository
      uses: actions/checkout@v7

    - name: Download built extensions
      uses: actions/download-artifact@v8
      with:
        path: dist
        merge-multiple: true

    - name: Create release and attach extensions
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        TAG="${{ github.event_name == 'push' && github.ref_name || inputs.tag }}"
        echo "Releasing $TAG"
        ls -l dist
        if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          echo "Release $TAG already exists - uploading assets"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" dist/*.zip --clobber
        else
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "Version ${TAG#v}" \
            --notes-file RELEASE_NOTES.md \
            --target "$GITHUB_SHA" \
            dist/*.zip
        fi
        gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,assets \
          --template '{{.tagName}}{{range .assets}} -> {{.name}}{{end}}{{"\n"}}'
